services:
  schwab-gateway:
    build:
      context: .
      dockerfile: .docker/Dockerfile
    ports:
      - "8182:8182"
    restart: always
    env_file: .env
    command: ["uv", "run", "uvicorn", "gateway.main:app", "--host", "0.0.0.0", "--port", "8182", "--reload"]
    volumes:
      - schwab_token:/root/.schwab
      - ./gateway:/app/gateway
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8182/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  schwab_token:
