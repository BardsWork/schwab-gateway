[project]
name = "schwab-gateway"
version = "0.1.0"
description = "Local HTTP microservice that centralises Schwab OAuth tokens and proxies market-data calls."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "schwab-py>=1.4.0",
    "polars>=0.20.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
